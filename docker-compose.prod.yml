# 운영용 compose — 빌드하지 않고 GHCR 이미지를 받아 띄운다.
#
# ── dev(docker-compose.yml)와 무엇이 다른가 ──────────────────────────────────
#
#   1. build → image. 호스트에서 소스를 컴파일하지 않는다. CI 가 만든 이미지를 받는다
#      (.github/workflows/cd-backend.yml). 배포 호스트에 JDK·Gradle 이 필요 없고,
#      "테스트를 통과한 그 커밋"이 그대로 뜬다
#   2. MySQL 포트를 호스트에 노출하지 않는다. dev 는 워크벤치 접속 편의로 열어뒀지만
#      운영에서 3306 을 인터넷에 여는 것은 그 자체로 사고다. 같은 네트워크의 컨테이너는
#      서비스 이름으로 붙으므로 노출이 필요 없다
#   3. 시크릿에 기본값을 두지 않는다. dev 는 JWT_SECRET 에 폴백이 있는데(그래서 실행이
#      쉽다) 운영에서 그 값이 그대로 뜨면 토큰을 누구나 위조할 수 있다.
#      아래는 전부 필수 — .env 에 없으면 compose 가 빈 값으로 뜨므로 배포 전에 확인할 것
#
# ── 스키마 ────────────────────────────────────────────────────────────────────
#
#   initdb 마운트가 없다. 백엔드가 부팅하며 Flyway 로 적용한다 (이슈 #115).
#   빈 DB 면 V1 → V2 가 순차 적용되고, 기존 DB 면 baseline 이 찍힌 뒤 미적용분만 돈다.
#   적용 결과 확인 — 🔴 8080 이 아니다. 액추에이터는 관리 포트 9090 이고, 이 파일은 그 포트를
#   호스트에 매핑하지 않는다(의도된 설계). 그래서 prod 에서 HTTP 로 보려면 컨테이너 안에서 부른다:
#     docker exec shadowfit-backend wget -qO- http://localhost:9090/actuator/flyway
#   포트 매핑에 기대지 않는 확인 경로는 DB 직접 조회다 (flyway_schema_history).
#   자세한 비교는 docs/19-deployment.md §2.3 (이슈 #130).
#
# ── 쓰는 법 ───────────────────────────────────────────────────────────────────
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
#   특정 커밋으로 고정하려면 (권장 — latest 는 이동 태그라 무엇이 떠 있는지 특정 못 한다):
#   IMAGE_TAG=sha-<full-commit-sha> docker compose -f docker-compose.prod.yml up -d
#
#   자세한 절차는 docs/19-deployment.md.
#
# ⚠️ 이 파일은 아직 **실제 호스트에서 검증되지 않았다.** 배포 대상이 없어서다
#    (상시 EC2 인스턴스 없음). 문법·구성은 맞춰뒀지만 "돌려봤다"고 말할 수 없다.

services:
  mysql:
    image: mysql:8.0
    container_name: shadowfit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?운영 배포에는 필수}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shadowfit}
      MYSQL_USER: ${MYSQL_USER:?운영 배포에는 필수}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?운영 배포에는 필수}
      TZ: Asia/Seoul
    # ports 없음 — 의도적이다 (위 2번). 호스트에서 붙어야 하면
    #   docker exec -it shadowfit-mysql mysql -u...
    # 를 쓰거나, 필요한 동안만 SSH 터널을 뚫는다.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/charset.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-1G}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shadowfit-net

  shadowfit-backend:
    # IMAGE_REPO 를 두는 이유: 포크나 다른 조직에서도 그대로 쓰이게 하기 위해서다.
    # 기본값은 이 저장소의 GHCR 경로(소문자 — GHCR 요구사항).
    image: ${BACKEND_IMAGE:-ghcr.io/shadowfit/init/backend}:${IMAGE_TAG:-latest}
    container_name: shadowfit-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6565:6565"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_HOST: shadowfit-mysql
      DB_NAME: ${MYSQL_DATABASE:-shadowfit}
      DB_USERNAME: ${DB_USERNAME:?운영 배포에는 필수}
      DB_PASSWORD: ${DB_PASSWORD:?운영 배포에는 필수}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?운영 배포에는 필수}
      AI_SERVER_HOST: shadowfit-ai
      AI_SERVER_GRPC_PORT: 8585
      # AI 채널 풀 크기 — shadowfit-ai 의 AI_WORKER_COUNT 와 같은 값이어야 한다(#552,
      # dev docker-compose.yml 과 같은 소스 ${AI_WORKER_COUNT} 하나). 이게 없으면 둘이
      # 각자 기본값(둘 다 3)에 우연히 맞을 뿐이라, 배포 스크립트가 AI_WORKER_COUNT 만
      # 바꾸면 조용히 어긋난다.
      AI_CHANNEL_POOL_SIZE: ${AI_WORKER_COUNT:-3}
      # 폴백 없음 — dev compose 와 의도적으로 다르다 (위 3번)
      JWT_SECRET: ${JWT_SECRET:?운영 배포에는 필수. Base64 32바이트 이상}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 배포 직후 "떴는지"를 compose 가 판정할 수 있게 한다. Flyway 마이그레이션이
      # 오래 걸릴 수 있어 start_period 를 넉넉히 잡는다 (V1 baseline 은 테이블 12개를 만든다).
      # 포트 9090 — 앱 포트가 아니라 **관리 포트**다 (application.yml [6], 2026-08-08).
      # 컨테이너 안에서 부르므로 호스트 매핑이 없어도 닿는다.
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - shadowfit-net

  shadowfit-ai:
    image: ${AI_IMAGE:-ghcr.io/shadowfit/init/ai-server}:${IMAGE_TAG:-latest}
    container_name: shadowfit-ai
    restart: unless-stopped
    # 워커 3개(N=3, GIL 병목 회피 — ai-channel-pool-hardening.md)를 별도 포트로 띄운다.
    # 호스트 포트 매핑이 없다 — 프론트가 워커를 직접 못 찍고 항상 ai-nginx(8000)를 거쳐야
    # 세션 고정 라우팅(X-AI-Worker 헤더)이 성립한다. #552: 이 계층이 없으면 워커 1·2로
    # 시작된 세션의 프레임이 워커 0 으로만 가서 NO_LEASE 로 거절된다.
    # gRPC 8585-8587 은 Spring 만 같은 네트워크에서 호출하므로 expose 로 유지(외부 노출 X).
    expose:
      - "8000"
      - "8001"
      - "8002"
      - "8585"
      - "8586"
      - "8587"
    # 🔴 **왜 필수인가** (#214). 검출기 풀이 크기를 이 한도에서 유도하고
    #    (`mediapipe_detector.py:285-293`), 한도도 `POSE_DETECTOR_POOL_SIZE` 도 없으면
    #    RuntimeError 다. 그런데 그 호출은 기동이 아니라 **StartAnalysis 에서 처음**
    #    일어난다(`exercise_servicer.py:110`) — 즉 **한도 없이 뜬 컨테이너는 `up` 도
    #    헬스체크도 통과한 뒤 첫 사용자에게 실패를 준다.**
    #
    #    ⚠️ **그 실패는 이 파일에서는 더 이상 안 일어난다.** 아래 `${AI_MEM_LIMIT:?…}` 가
    #    값이 없으면 **컨테이너를 만들기 전에 `up` 을 멈춘다.** 위 「첫 세션에서 죽는다」는
    #    **compose 를 안 거치는 배포 경로**(직접 `docker run`, k8s 매니페스트 등 한도를
    #    안 거는 경우)에 남아 있는 위험이고, 여기서는 그 경로를 막는 것이 목적이다.
    #
    #    그래서 **기본값을 두지 않고 명시를 요구한다**(위 토큰들과 같은 규약). 운영 대상
    #    호스트가 아직 0대라 «몇 MB가 맞나» 는 배포 형태에 달려 있고(`docs/19-deployment.md:289`),
    #    여기에 로컬 기본값(1536m)을 흘리면 그게 출처 없는 운영 기준값이 된다.
    #
    #    값 유도(dev compose 주석과 같은 실측): 검출기 1개 **98.7MB** · 기본 RSS **100.5MB**
    #      한도 = 100.5MB + 98.7MB × 동시 세션 수
    #
    #    🔴 **이 공식대로 «딱 맞추면» 안 된다 — 여유를 둘 것.** 공식은 **검출기만** 센다.
    #    `memory_ceiling()` 이 스스로 경고한다: *"프레임 버퍼·base64 임시·파이썬 힙·gRPC 는
    #    미측정이라 안 뺐다. 그러니 컨테이너 한도 자체에 여유를 두라."* 딱 맞추면 풀이 세션을
    #    거절하기 **전에** 컨테이너가 OOM 으로 죽는다 — 그러면 실패 방향이 «세션이 덜
    #    받아짐»(안전)이 아니라 «죽음»(위험)으로 뒤집힌다.
    #    ⚠️ **여유를 «몇 %» 로 할지는 여기 안 적는다** — 그 값이 미측정이라 숫자를 박으면
    #    그게 출처 없는 기준값이다. 재려면 #229.
    #
    #    실패 방향: 작게 주면 «세션이 덜 받아짐»(돌긴 한다), 크게 주면 «안 뜸».
    mem_limit: ${AI_MEM_LIMIT:?운영 배포에는 필수 — 검출기 풀이 이 값에서 유도된다. docs/19-deployment.md §2.1}
    environment:
      DEBUG: "false"
      TZ: Asia/Seoul
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?운영 배포에는 필수}
      # 프론트 → AI HTTP 직결 전용. 앱 번들에 배포되는 값이라 위 내부 토큰과 **다른 값**이어야
      # 한다 (이슈 #134, decisions/ai-auth-token-flow.md ㄱ). 같은 값을 넣으면 분리가 무의미하다.
      AI_PUBLIC_TOKEN: ${AI_PUBLIC_TOKEN:?운영 배포에는 필수. INTERNAL_API_TOKEN 과 달라야 함}
      POSE_MODEL_COMPLEXITY: ${POSE_MODEL_COMPLEXITY:-1}
      # 0 = 위 `mem_limit` 에서 유도(권장). 값을 주면 그 값을 쓰되 메모리 상한을 넘으면
      # 낮춰진다(`mediapipe_detector.py:297-300`). **두 레버 중 하나는 반드시 있어야 한다** —
      # 여기 통로를 열어두는 것은 «한도를 못 거는 배포 형태» 를 위한 탈출구다.
      POSE_DETECTOR_POOL_SIZE: ${POSE_DETECTOR_POOL_SIZE:-0}
      # 워커 프로세스 수 — entrypoint.sh 가 이 값으로 몇 개를 띄우고 포트를 어떻게 나눌지
      # 정한다. 위 shadowfit-backend 의 AI_CHANNEL_POOL_SIZE 와 같은 소스다.
      AI_WORKER_COUNT: ${AI_WORKER_COUNT:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shadowfit-net

  # 프론트 → AI 프레임 경로(POST /pose) 세션 고정 라우팅 (#552, dev docker-compose.yml 과 같은
  # 구성). Spring 이 세션 시작 응답으로 알려준 워커 인덱스를 프론트가 X-AI-Worker 헤더로
  # 실어 보내면, 그대로 해당 워커 포트로 고정 전달한다(nginx-ai/default.conf).
  ai-nginx:
    image: nginx:1.27-alpine
    container_name: shadowfit-ai-nginx
    restart: unless-stopped
    depends_on:
      - shadowfit-ai
    ports:
      - "8000:8000"
    volumes:
      - ./nginx-ai/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shadowfit-net

networks:
  shadowfit-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local

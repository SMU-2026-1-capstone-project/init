# 프론트 → AI 프레임 경로(POST /pose) 세션 고정 라우팅.
# X-AI-Worker 헤더(0/1/2, Spring이 세션 시작 응답으로 알려준 값)를 그대로 백엔드 포트에 매핑한다.
# 세션ID로 나머지 연산을 직접 하지 않는 이유: Spring이 이미 Math.floorMod(sessionId, 3)을
# 계산해두므로, nginx가 같은 계산을 또 하면 둘이 어긋날 위험(로직 이원화)이 생긴다.
map $http_x_ai_worker $ai_backend {
    "0"     shadowfit-ai:8000;
    "1"     shadowfit-ai:8001;
    "2"     shadowfit-ai:8002;
    default shadowfit-ai:8000;  # 헤더 없는 옛 클라(배포 전 세션) 호환 — worker 0으로 보낸다
}

server {
    listen 8000;
    resolver 127.0.0.11 valid=30s;  # docker 내장 DNS — proxy_pass 대상이 변수라 런타임 조회가 필요

    location / {
        proxy_pass http://$ai_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # /health, /metrics 등 워커 무관 엔드포인트도 그대로 통과 — default가 worker 0으로 보낸다.
    }
}

# 프론트 → AI 프레임 경로(POST /pose) 세션 고정 라우팅.
# X-AI-Worker 헤더(Spring이 세션 시작 응답으로 알려준 aiWorkerIndex 값)를 그대로 백엔드
# 포트에 매핑한다. 세션ID로 나머지 연산을 직접 하지 않는 이유: Spring이 이미
# Math.floorMod(sessionId, aiChannelPoolSize)를 계산해두므로, nginx가 같은 계산을 또 하면
# 둘이 어긋날 위험(로직 이원화)이 생긴다.
#
# 이 파일은 정적 설정이라 반복문이 없어서 AI_WORKER_COUNT(docker-compose)를 직접 못 읽는다.
# 대신 워커 0~9 자리를 실제 운용 수와 무관하게 전부 미리 열어둔다 — entrypoint.sh가
# base(8000) + 인덱스로 포트를 산술 유도하는 공식과 여기 포트 목록이 같은 규칙을 따르는
# 한, AI_WORKER_COUNT를 3에서 다른 값(≤10)으로 바꿔도 이 파일은 손 안 대도 된다
# (docs/decisions/ai-channel-pool-hardening.md). Spring의 aiChannelPoolSize가 실제
# 워커 수를 넘는 인덱스를 만들지 않으므로, 안 쓰는 자리는 그냥 도달하지 않는다.
# ⚠️ AI_WORKER_COUNT가 10을 넘으면 이 map에 줄을 추가해야 한다.
map $http_x_ai_worker $ai_backend {
    "0"     shadowfit-ai:8000;
    "1"     shadowfit-ai:8001;
    "2"     shadowfit-ai:8002;
    "3"     shadowfit-ai:8003;
    "4"     shadowfit-ai:8004;
    "5"     shadowfit-ai:8005;
    "6"     shadowfit-ai:8006;
    "7"     shadowfit-ai:8007;
    "8"     shadowfit-ai:8008;
    "9"     shadowfit-ai:8009;
    default shadowfit-ai:8000;  # 헤더 없는 옛 클라(배포 전 세션) 호환 — worker 0으로 보낸다
}

server {
    listen 8000;
    resolver 127.0.0.11 valid=30s;  # docker 내장 DNS — proxy_pass 대상이 변수라 런타임 조회가 필요

    # nginx 기본값(1m)이 app/models/pose.py의 image max_length=20_000_000자(base64,
    # ≈19.07MiB)보다 작아서 dev에서는 nginx가 먼저 413으로 막고 앱의 상한이 죽은 설정이
    # 되고 있었다. 그 20,000,000자 자체도 실측이 아니라 "정상 프레임은 절대 안 넘고
    # DoS 페이로드만 걸리는" 안전판(pose.py 주석)이므로, 여기도 같은 성격의 값을 맞춘다 —
    # JSON 오버헤드(필드명·exercise_type 등) 여유를 얹어 21m.
    client_max_body_size 21m;

    location / {
        proxy_pass http://$ai_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # /health, /metrics 등 워커 무관 엔드포인트도 그대로 통과 — default가 worker 0으로 보낸다.
    }
}

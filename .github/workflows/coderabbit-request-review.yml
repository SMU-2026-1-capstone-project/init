# CodeRabbit 은 이 저장소에서 자동 리뷰를 하지 않는다.
#
#   "This repository does not receive automatic reviews because it has fewer than 10 stars."
#
# `.coderabbit.yaml` 의 `auto_review.enabled: true` 는 그 정책 앞에서 무력하다. 봇이 PR 마다
# 체크를 초록으로 찍기는 하지만 그것은 «리뷰 통과» 가 아니라 «스킵했다» 는 표시다.
# 리뷰를 받으려면 PR 에 `@coderabbitai review` 를 코멘트로 달아야 한다 — 그 한 줄을 사람이
# 기억하는 대신 여기서 건다.
#
# ─────────────────────────────────────────────────────────────────────────
# 🔴 봇이 단 코멘트는 CodeRabbit 이 **버린다** — 2026-08-22 실측 ([#349](https://github.com/Shadowfit/init/issues/349))
#
# 초판(#344)은 이것을 「미검증」으로 두고 `GITHUB_TOKEN` 으로 코멘트했다. 세 판을 재보니
# 주체 하나에서 갈렸다:
#
#   | 명령 주체              | PR 상태 | CodeRabbit 응답                          |
#   |------------------------|---------|------------------------------------------|
#   | `github-actions[bot]`  | 열림    | **없음** (11.5분 폴링, 에러조차 없다)     |
#   | 사람 계정              | 닫힘    | 8초 — "Action not completed: PR is closed"|
#   | 사람 계정              | 열림    | 14초 — **"Action performed: Review triggered."** |
#
# 즉 별 10개 미만 정책이 막는 것은 **자동 리뷰**뿐이고 명령은 받아 준다. 다만 **봇 계정의
# 명령은 조용히 버려진다.** 그래서 이 워크플로는 개인 토큰 `CODERABBIT_TRIGGER_TOKEN`
# (scope: repo 또는 fine-grained 의 Pull requests: write)을 **필수**로 요구한다.
#
# 🔴 없을 때 «경고만 하고 코멘트를 달던» 예전 동작으로 되돌리지 말 것. 그러면 체크는
#    초록인데 리뷰는 없는 상태가 된다 — 이 워크플로가 애초에 고치려던 그 실패다.
#    없으면 **빨강으로 죽는다.** 고칠 수 있는 설정 문제는 눈에 보여야 한다.
#
# 시크릿 넣는 법:
#   gh secret set CODERABBIT_TRIGGER_TOKEN --repo Shadowfit/init --body "<PAT>"
#
# ⚠️ **--body 를 빼면 안 된다.** 값 없이 실행하면 gh 가 stdin 에서 읽는데, TTY 가 아닌 곳
#    (CI·에이전트 세션)에서는 즉시 EOF 라 **빈 문자열이 저장되고 명령은 성공한 듯 조용히
#    끝난다.** 그러면 시크릿 목록에는 이름이 뜨는데 이 워크플로는 「없다」로 죽는다 —
#    **「없다」와 「비었다」가 같은 얼굴이라** 2026-08-22 에 여섯 판을 헛태웠다(#362).
#    판별: `gh api repos/<owner>/<repo>/actions/secrets/<NAME> --jq .updated_at` 이 갱신됐나.
# ─────────────────────────────────────────────────────────────────────────
name: Request CodeRabbit review

# pull_request 가 아니라 pull_request_target 인 이유:
# 포크에서 온 PR 과 dependabot 이 연 PR 은 GITHUB_TOKEN 이 읽기 전용이라 코멘트를 못 단다.
# 이 잡은 PR 코드를 체크아웃하지 않으므로(=신뢰 못 할 코드를 실행하지 않으므로)
# pull_request_target 을 써도 안전하다.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

# 모든 호출이 개인 토큰으로 나가므로 GITHUB_TOKEN 에는 아무 권한도 주지 않는다.
# (되돌려 GITHUB_TOKEN 을 쓰려면 `pull-requests: write` 가 다시 필요하다 — 다만 위 실측대로
#  그 토큰으로 단 코멘트는 CodeRabbit 이 무시한다.)
permissions: {}

concurrency:
  group: coderabbit-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Comment @coderabbitai review
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # ⓪ 개인 토큰이 없으면 **코멘트를 달지 않고 죽는다.** 달아봐야 버려지고,
          #    버려진 코멘트는 「리뷰 요청했다」는 착시만 남긴다(#349).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::[토큰] CODERABBIT_TRIGGER_TOKEN 이 **없거나 값이 비어 있다.** 봇 계정(GITHUB_TOKEN)이 단 코멘트는 CodeRabbit 이 무시하므로(#349) 코멘트를 달지 않고 죽는다."
            echo "::error::[토큰] 넣는 법: gh secret set CODERABBIT_TRIGGER_TOKEN --repo ${REPO} --body '<PAT>'  ← **--body 를 빼면 안 된다.** TTY 가 아닌 곳(CI·에이전트 세션)에서 값 없이 실행하면 stdin 이 즉시 EOF 라 **빈 값이 조용히 저장된다** — 시크릿 목록에는 뜨는데 이 줄이 나온다(2026-08-22 실측)."
            echo "::error::[토큰] 판별법: gh api repos/${REPO}/actions/secrets/CODERABBIT_TRIGGER_TOKEN --jq .updated_at 이 갱신됐는지 본다. 안 바뀌었으면 안 들어간 것이다."
            exit 1
          fi

          # ① draft 에는 걸지 않는다. ready_for_review 로 바뀔 때 다시 이 잡이 돈다.
          if [ "$DRAFT" = "true" ]; then
            echo "draft PR 이라 건너뛴다 — ready 로 바꾸면 그때 건다."
            exit 0
          fi

          # ② 봇이 연 PR(dependabot 등)에는 걸지 않는다. 리뷰가 필요하면 손으로 코멘트를 단다.
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "봇이 연 PR 이라 건너뛴다."
            exit 0
          fi

          # ③ CodeRabbit 은 변경 파일 100 개를 넘으면 명령을 받고도 스킵한다(#298 이 140 파일이라 스킵됐다).
          #    조용히 스킵당하면 «리뷰받았다» 고 오해하므로, 코멘트를 달지 않고 경고를 남긴다.
          if [ "${CHANGED_FILES:-0}" -gt 100 ]; then
            echo "::warning::변경 파일 ${CHANGED_FILES} 개 — CodeRabbit 은 100 개 초과 PR 을 스킵한다. 리뷰가 필요하면 PR 을 쪼개라."
            exit 0
          fi

          URL=$(gh pr comment "$PR" --repo "$REPO" --body "@coderabbitai review")
          MY_ID=${URL##*-}
          echo "PR #${PR} 에 리뷰 요청을 달았다 (변경 파일 ${CHANGED_FILES} 개) — $URL"

          # ④ **응답을 확인한다.** 여기까지가 이 워크플로의 일이다.
          #    「코멘트를 달았다」와 「리뷰가 시작됐다」는 다른 사실이고, 그 둘을 구분하지
          #    않은 것이 #344 의 첫 판이 조용히 실패한 이유다. 실측(2026-08-22)에서 응답은
          #    14초에 왔다 — 2분이면 넉넉하다.
          for i in $(seq 1 12); do
            sleep 10
            REPLY=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq "[.[] | select(.id > $MY_ID) | select(.user.login == \"coderabbitai[bot]\") | .body] | last // empty" || true)
            [ -n "$REPLY" ] || continue

            if printf '%s' "$REPLY" | grep -q "Review triggered"; then
              echo "✅ CodeRabbit 이 리뷰를 시작했다 ($(( i * 10 ))초)."
              exit 0
            fi
            # 받긴 받았는데 안 하겠다는 답(닫힌 PR·이미 리뷰한 커밋 등). 사유를 그대로 올린다.
            echo "::error::CodeRabbit 이 요청을 받았지만 리뷰를 시작하지 않았다: $(printf '%s' "$REPLY" | tr '\n' ' ' | sed 's/<!--[^>]*-->//g' | cut -c1-300)"
            exit 1
          done

          echo "::error::리뷰 요청에 CodeRabbit 이 2분 동안 응답하지 않았다. 봇 계정의 명령이 버려질 때 나오는 얼굴이다(#349) — CODERABBIT_TRIGGER_TOKEN 이 사람 계정의 것인지 확인할 것."
          exit 1

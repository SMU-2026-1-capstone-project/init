name: CD — ai-server 이미지

# main 에 ai-server 변경이 들어오면 컨테이너 이미지를 만들어 GHCR 에 올린다.
# 구조는 cd-backend.yml 과 같다 — 그쪽 주석에 선택 근거가 적혀 있다.
#
# ⚠️ 배포하지 않는다. 이미지를 레지스트리에 두는 데서 끝난다 (배포 대상 호스트 없음).

on:
  push:
    branches: [main]
    paths:
      - 'ai-server/**'
      - '.github/workflows/cd-ai-server.yml'
      - '.github/workflows/ai-server-test.yml'
  workflow_dispatch:

concurrency:
  group: cd-ai-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 테스트 게이트
    uses: ./.github/workflows/ai-server-test.yml

  build-and-push:
    name: 이미지 빌드·푸시
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 결정
        id: image
        run: |
          name=$(printf '%s/ai-server' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${name}" >> "$GITHUB_OUTPUT"
          echo "이미지: ghcr.io/${name}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그·라벨 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./ai-server
          file: ./ai-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # MediaPipe·OpenCV 의존성 설치가 빌드의 대부분이라 캐시 효과가 크다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 요약
        run: |
          {
            echo "## ai-server 이미지 푸시 완료"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Check shell scripts parse

# 이 저장소의 .sh 는 아무 잡에도 안 걸려 있었다 (#333). 백엔드·AI·proto 는 PR 에서
# 막히는데 셸은 경로 필터에도 안 잡혀, 셸만 고친 PR 은 자동 검사가 **0건**으로 머지됐다
# (#331 에서 46줄을 고쳤는데 돈 것은 CodeRabbit 하나뿐이었다).
#
# 🔴 이 잡이 무엇을 «안» 하는지 먼저 적는다. `bash -n` 은 **파싱만** 한다. 이 저장소의
#    실제 rig 결함은 대부분 의미 층이다 — 팔이 조용히 건너뛰거나(#260), 부하기가 작아
#    측정이 통째로 빠지거나(#312), rig 이 옛 스키마를 만들거나(#320). 그런 것은 문법이
#    멀쩡하므로 여기서 안 잡힌다. 이 잡의 값은 «최소선» 이지 «rig 을 지킨다» 가 아니다.
#
#    그 위 층(따옴표·미정의 변수)은 shellcheck 의 몫이고, 현재 경고 수를 모르는 상태라
#    별건으로 남겨 뒀다 (#333 의 2번).

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-syntax-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-syntax-check.yml'

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (전수)
        run: |
          # 실행하지 않는다 — 파싱만 한다. DB·도커·자산이 필요 없다.
          #
          # 대상에서 빼는 것: 남의 코드(node_modules·.venv)와 작업용 워크트리.
          # 과거 라운드 산출물(loadtest/results/<날짜>/)은 **일부러 포함한다** — 기록이지만
          # 지금 전부 통과하므로 넣는 비용이 0 이고, 옛 rig 을 손볼 때도 그물이 있는 편이 낫다.
          mapfile -t files < <(
            find . -name '*.sh' \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/.venv/*' \
              -not -path './.claude/worktrees/*' \
              | sort
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::.sh 를 하나도 못 찾았다 — find 조건이나 체크아웃을 볼 것"
            exit 1
          fi

          echo "검사 대상 ${#files[@]}개"

          # 첫 실패에서 멈추지 않는다. 한 번 돌려 **깨진 것을 전부** 보여주는 편이
          # 고치는 쪽에 싸다.
          failed=0
          for f in "${files[@]}"; do
            if ! err=$(bash -n "$f" 2>&1); then
              echo "::error file=${f#./}::구문 오류 — $err"
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "🔴 ${failed}개 파일이 파싱되지 않는다"
            exit 1
          fi
          echo "✅ ${#files[@]}개 전부 파싱된다"

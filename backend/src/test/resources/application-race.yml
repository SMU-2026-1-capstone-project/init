# 경쟁조건 재현 전용 프로파일 — 실제 MySQL 을 가리킨다.
#
# 왜 H2(기본 테스트 프로파일)로는 안 되는가:
#   기본 테스트는 ddl-auto: create-drop 이라 Hibernate 가 엔티티에서 스키마를 만든다.
#   PoseData 의 @ManyToOne @JoinColumn(session_id) 가 FK 제약을 생성하므로,
#   H2 테스트 스키마에는 프로덕션(V1__baseline.sql)에 없는 FK 가 생긴다.
#   프로덕션은 파티셔닝 때문에 FK 를 뗐다(docs/decisions/pose-data-partition-fk-tradeoff.md).
#
#   그래서 orphan INSERT 가 H2 에서는 참조무결성 위반으로 터지고 MySQL 에서는 조용히 들어간다.
#   재현이 안 되는 게 아니라 결과가 반대로 나온다. "FK 가 없다"는 전제 위에 세워진 결함은
#   원리상 H2 로 검증할 수 없다.
#
# 띄우는 법 (개발용 DB 를 건드리지 않도록 3307 에 일회용 컨테이너):
#   docker run -d --name shadowfit-race-mysql -e MYSQL_ROOT_PASSWORD=racetest \
#     -e MYSQL_DATABASE=shadowfit -p 3307:3306 mysql:8.0 \
#     --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
#   for f in backend/src/main/resources/db/migration/V*.sql; do \
#     docker exec -i shadowfit-race-mysql mysql -uroot -pracetest shadowfit < "$f"; done
#
#   [정정 2026-08-22 · #342] 여기 「V1__baseline.sql 하나만」 적재하라고 적혀 있었다.
#   마이그레이션이 V8 까지 왔으므로(V8 = 세션 nonce, #323) 그대로 따라 하면 엔티티와 스키마가
#   어긋나 `Unknown column 'session_nonce'` 로 죽는다. 절차가 낡으면 테스트가 «있어도 안 도는»
#   상태가 되고, 이 파일의 테스트들은 CI 에서 건너뛰므로 그 사실이 드러나지 않는다.
#   그래서 파일을 집지 않고 디렉터리 전체를 순서대로 적재한다 — 마이그레이션이 늘어도 안 낡는다.
#
#   (경로가 바뀐 이유: Flyway 도입으로 schema.sql 이 V1__baseline.sql 이 됐다.
#    파일에서 CREATE DATABASE/USE 를 뺐지만 위 명령이 DB 를 지정하므로 그대로 동작한다.)
#
# 도는 법 (시스템 프로퍼티가 없으면 테스트 자체가 건너뛰어져 CI 는 영향 없음):
#   ./gradlew :backend:test --tests '*PoseDataOrphanRaceTest' -Drace.mysql=true
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/shadowfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: racetest
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 를 끈다 — 이 프로파일은 위 수동 절차로 만든 스키마를 **그대로** 관찰하는 게
  # 목적이다. 스키마를 누가 만들었는지가 재현 결과를 바꾸진 않지만(V1 이 곧 옛 schema.sql),
  # 재현 harness 는 변수를 늘리지 않는 편이 낫다.
  flyway:
    enabled: false

  jpa:
    # 스키마는 위 수동 절차(V1__baseline.sql)가 만든 것을 그대로 쓴다 — 엔티티에서
    # 생성하면 위에 적은 FK 문제가 그대로 재현된다.
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

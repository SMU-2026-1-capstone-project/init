spring:
  application:
    name: shadowfit-test

  # 테스트는 H2 인메모리 DB 사용 (MySQL 호스트 의존 제거)
  datasource:
    # IGNORECASE=TRUE 는 취향이 아니라 **운영 컬레이션을 맞추는 설정**이다.
    # 운영 MySQL 은 utf8mb4_unicode_ci 라 문자열 비교가 대소문자를 무시한다. H2 는 기본이
    # 구분이므로, 그대로 두면 검색 기능이 테스트와 운영에서 다르게 동작한다.
    # (issue #105 로 containsIgnoreCase→contains 로 바꾸면서 대소문자 무시가 코드에서
    #  DB 설정으로 옮겨갔다 — 그 전제를 테스트에서도 성립하게 만들어야 검증이 의미를 갖는다)
    url: jdbc:h2:mem:shadowfit_test;MODE=MySQL;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # MySQL 전용 초기화 스크립트 비활성화. JPA가 엔티티 기반으로 스키마 생성.
  sql:
    init:
      mode: never

  # Flyway 비활성화 — 테스트는 H2 이고 마이그레이션은 MySQL 전용 DDL(파티셔닝·ENUM·
  # AUTO_INCREMENT 등)이라 그대로 돌면 깨진다. 테스트 DB 는 종전대로 ddl-auto:
  # create-drop 이 엔티티에서 만든다.
  #
  # ⚠️ 이 구조의 한계는 그대로다 — 테스트는 언제나 "Java 기준" 스키마를 보므로
  #    엔티티와 마이그레이션이 어긋나도 초록불이 뜬다. 그 틈을 좁히는 게
  #    SchemaEnumConsistencyTest 다 (ENUM 한정). schema-migration-tracking.md §1 참조.
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false

# gRPC 클라이언트는 컨텍스트 로드 시 실제 연결을 시도하지 않으므로 그대로 두되,
# 테스트에서 호출되지 않도록 더미 주소만 지정
grpc:
  port: 0
  server:
    port: 0
  client:
    fastapi-client:
      address: 'static://localhost:0'
      negotiation-type: plaintext

# 프로덕션 설정에서 ${JWT_SECRET}, ${INTERNAL_API_TOKEN}이 필수이므로 테스트용 더미값 주입
jwt:
  secret: test-secret-key-for-unit-tests-only-do-not-use-in-production-environment
  expiration_time: 86400
  refresh_expiration_time: 604800

internal:
  api:
    token: test-internal-token

ai-server:
  url: http://localhost:0

security:
  whitelist:
    - "/"
    - "/error"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/member/login"
    - "/member/signup"
    - "/ws/**"

exercise:
  session:
    timeout:
      default-buffer-minutes: 30
      check-interval-minutes: 1

logging:
  level:
    root: WARN
    com.shadowfit: INFO
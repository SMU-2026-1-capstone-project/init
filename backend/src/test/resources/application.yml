spring:
  application:
    name: shadowfit-test

  # 테스트는 H2 인메모리 DB 사용 (MySQL 호스트 의존 제거)
  datasource:
    # IGNORECASE=TRUE 는 취향이 아니라 **운영 컬레이션을 맞추는 설정**이다.
    # 운영 MySQL 은 utf8mb4_unicode_ci 라 문자열 비교가 대소문자를 무시한다. H2 는 기본이
    # 구분이므로, 그대로 두면 검색 기능이 테스트와 운영에서 다르게 동작한다.
    # (issue #105 로 containsIgnoreCase→contains 로 바꾸면서 대소문자 무시가 코드에서
    #  DB 설정으로 옮겨갔다 — 그 전제를 테스트에서도 성립하게 만들어야 검증이 의미를 갖는다)
    url: jdbc:h2:mem:shadowfit_test;MODE=MySQL;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # MySQL 전용 초기화 스크립트 비활성화. JPA가 엔티티 기반으로 스키마 생성.
  sql:
    init:
      mode: never

  # Flyway 비활성화 — 테스트는 H2 이고 마이그레이션은 MySQL 전용 DDL(파티셔닝·ENUM·
  # AUTO_INCREMENT 등)이라 그대로 돌면 깨진다. 테스트 DB 는 종전대로 ddl-auto:
  # create-drop 이 엔티티에서 만든다.
  #
  # ⚠️ 이 구조의 한계는 그대로다 — 테스트는 언제나 "Java 기준" 스키마를 보므로
  #    엔티티와 마이그레이션이 어긋나도 초록불이 뜬다. 그 틈을 좁히는 게
  #    SchemaEnumConsistencyTest 다 (ENUM 한정). schema-migration-tracking.md §1 참조.
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false

# gRPC 클라이언트는 컨텍스트 로드 시 실제 연결을 시도하지 않으므로 그대로 두되,
# 테스트에서 호출되지 않도록 더미 주소만 지정
grpc:
  port: 0
  server:
    port: 0
  client:
    fastapi-client:
      address: 'static://localhost:0'
      negotiation-type: plaintext

# 프로덕션 설정에서 ${JWT_SECRET}, ${INTERNAL_API_TOKEN}이 필수이므로 테스트용 더미값 주입
jwt:
  secret: test-secret-key-for-unit-tests-only-do-not-use-in-production-environment
  expiration_time: 86400
  refresh_expiration_time: 604800

internal:
  api:
    token: test-internal-token

ai-server:
  url: http://localhost:0

# ⚠️ 이 목록은 main 의 application.yml 과 **별개 사본**이다. 한쪽만 고치면 테스트와 운영의
# 인증 경계가 갈린다 — 실제로 /member/reissue(#135)를 main 에만 넣었다가 통합테스트가 전부
# 401 로 떨어져서 알았다. 다행히 «테스트가 먼저 깨지는» 방향이라 조용히 지나가지는 않는다.
#
# 🔴 2026-08-23: 그 안전장치가 **다섯 항목에는 안 걸렸다**(#350). 「테스트가 먼저 깨진다」는
#    그 경로를 **부르는 테스트가 있을 때만** 성립하는데, /swagger-ui.html · /webjars/** ·
#    /actuator/* 를 치는 테스트가 하나도 없어서 조용히 갈려 있었다(운영 13 · 테스트 8).
#    그래서 목록을 맞추는 것만으로는 부족하다 — 두 사본이 같은지 **단언하는 테스트**를 붙였다
#    (SecurityWhitelistParityTest). 다음 드리프트는 그 테스트가 시끄럽게 깬다.
security:
  whitelist:
    - "/"
    - "/error"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/webjars/**"
    - "/member/login"
    - "/member/signup"
    # access 가 만료된 상태로 불리는 것이 정상 경로라 permitAll 이 전제다 (이슈 #135).
    # 신원은 refresh token 의 서명에서 나온다 — decisions/token-lifecycle.md §4-2
    - "/member/reissue"
    - "/ws/**"
    - "/actuator/health"
    - "/actuator/health/**"
    # 관리 포트를 분리해도 필터체인은 두 포트에 공유된다(2026-08-08 실측) — 그래서 permitAll 이
    # 필요하다. 지표가 안 새는 근거는 인증이 아니라 **포트 경계**다(prod compose 가 9090 을
    # 호스트에 매핑하지 않는다). main 쪽 주석에 그 실측 로그가 있다.
    - "/actuator/prometheus"

exercise:
  session:
    timeout:
      default-buffer-minutes: 30
      check-interval-minutes: 1

logging:
  level:
    root: WARN
    com.shadowfit: INFO
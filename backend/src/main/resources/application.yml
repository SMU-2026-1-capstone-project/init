spring:
  application:
    name: shadowfit
  profiles:
    active: prod

  # 시간대 — 한국 전용 서비스 (협의 안건 #16, 갱신 15)
  # LocalDateTime 직렬화 형식 — § 12.5 결정과 정합 ("2026-05-28T10:00:03", timezone 마커 없음)
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  # [1] 데이터베이스 및 JPA 설정 (spring 하위로 정렬)
  datasource:
    # rewriteBatchedStatements=true: JDBC 드라이버가 batch INSERT 를 multi-row SQL 한 방으로 재작성 (부하테스트 §7.5 개선)
    url: jdbc:mysql://${DB_HOST:shadowfit-mysql}:${DB_PORT:3306}/${DB_NAME:shadowfit}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME:shadowfit}
    password: ${DB_PASSWORD:shadowfit}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 근거 (2026-08-09 4차 실측, docs/decisions/commit-count-and-mysql-metrics.md §0-1-ㄹ,
      # 원본 loadtest/results/commit-count-2026-08-09/ §2-3):
      #
      #   다세션 페이로드 · 기본 내구성 · c=100 에서
      #     pool  2 →  69%   pool  5 →  69%   pool 10 → 100%   pool 20 → 100% (plateau)
      #
      # **10 부터 plateau 고 5 는 부족하다.** 15 는 그 위의 여유값이다.
      #
      # 🔴 이 값이 말할 수 있는 것은 «5 는 부족하다» 까지다. «15 가 최적» 은 아니다 —
      #    10~20 사이를 좁히는 실험은 하지 않았고, 실익이 낮아 계획도 없다.
      #
      # 이력 (값은 15 로 유지됐지만 근거는 세 번 갈렸다):
      #   1차 2026-07-25  "10 은 47% 타임아웃, 15부터 안정" → **폐기.** «배치당 25행» 쓰던 코드
      #                   기준이고, 같은 PR #53 이 넣은 다운샘플(R=5)이 그 전제를 지웠다
      #   2차 2026-08-08  "절벽이 아예 없다"                → **조건부.** 부하가 단일 세션
      #                   하나로 몰리는 페이로드였고, 그 조건에서는 fsync 가 천장이라 풀이 가려졌다
      #   3차 2026-08-08  "천장은 커밋 fsync"                → **조건부.** 위와 같은 페이로드
      #   4차 2026-08-09  위 표. 다세션으로 재니 절벽이 다시 나타났다 (이슈 #166)
      #
      # ⚠️ 여기 있던 «병목이 백엔드 CPU 로 옮겨갔다» 는 **철회된 주장이라 지웠다** — 근거로 들었던
      #    수치가 수집된 적 없는 지표였다(pool-cliff-vs-concurrency.md §0-1). 인용하지 말 것.
      maximum-pool-size: 15

  # [1-1] Flyway — 스키마 마이그레이션 (이슈 #115, schema-migration-tracking.md §8)
  #
  # 무엇이 달라졌나: 예전엔 docker initdb 가 schema.sql 을 한 번 실행하는 게 전부라
  # "이 DB 가 어디까지 갔는지" 아무 데도 안 남았다. 이제 Flyway 가 적용 이력을
  # flyway_schema_history 테이블에 기록하고, 미적용분이 있으면 부팅 시 적용한다.
  #
  # 이력 확인: SELECT * FROM flyway_schema_history  또는  GET /actuator/flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

    # ⚠️ baseline-version 이 2 인 이유 (§3-1 baseline 함정)
    #   기존 DB 는 이미 V1(스키마)·V2(마스터 시드)에 해당하는 상태다. 여기에 Flyway 를
    #   처음 붙이면 baseline-on-migrate 가 "이 버전까지는 이미 됐다"고 도장을 찍는데,
    #   그 값이 1 이면 V2 가 실제로 실행돼 시드가 중복 INSERT 된다.
    #   2 로 찍어야 둘 다 건너뛰고 V3 부터 적용된다. 신규 설치는 빈 DB 라
    #   baseline 자체가 안 걸리고 V1→V2 가 정상 실행된다.
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: "existing schema before flyway"

    # 이미 적용된 파일이 바뀌면 부팅을 실패시킨다(기본값). 끄지 말 것 —
    # "누가 마이그레이션을 사후 수정했다"를 잡아주는 게 이 도구의 핵심 중 하나다.
    validate-on-migrate: true

  jpa:
     open-in-view: false # 2026-07-15: lazy 필드 접근이 뷰 렌더링 단계까지 조용히 숨겨지는 것 방지, 코드 작을 때 끔
     hibernate:
       # Flyway 가 스키마를 소유한다. Hibernate 는 만들지도 검증하지도 않는다.
       ddl-auto: none
     properties:
       hibernate:
         jdbc:
           batch_size: 25      # saveAll 을 batch 로 묶음 (부하테스트 §7.5 개선)
         order_inserts: true
         order_updates: true

  # [1.5] 로컬 캐시 (Caffeine) — feedbackTemplates: 쓰기 경로 없는 카탈로그성 데이터, 1시간은
  # 히트율 손해 목적이 아니라 미래에 관리자 CRUD 생기고 @CacheEvict 깜빡해도 자동 복구되는 안전판.
  # exercises: 쓰기 경로 있음(AdminExerciseService.updateThresholds) — @CacheEvict로 무효화,
  # findByIdCached(읽기 전용)만 캐시 타고 findById(쓰기 경로)는 캐시 미적용 유지.
  # exerciseReferences: 쓰기 경로(saveReferencePoses, 신규 운동 등록 시만)가 조회 메서드를
  # 재사용하지 않아 detached 엔티티 함정 없음 — findByExerciseId에 직접 @Cacheable, evict만 병행.
  cache:
    type: caffeine
    cache-names: feedbackTemplates,exercises,exerciseReferences # 시작 시 미리 등록 — 안 하면 Micrometer 가 지연생성 캐시를 못 잡음
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=500,recordStats

# [2] gRPC 설정 (최상단 레벨)
grpc:
  port: 6565
  server:
    port: 6565
    reflection-enabled: true
  client:
    fastapi-client: # @GrpcClient("fastapi-client")와 일치
      # 주소는 compose 가 주는 환경변수에서 온다 (#285). 이 줄이 하드코딩이던 동안
      # compose 의 AI_SERVER_HOST·AI_SERVER_GRPC_PORT 는 **아무도 안 읽는 죽은 키**였고,
      # 값이 우연히 같아서 증상이 없었다. 컨테이너명이나 포트를 바꾸면 옛 주소로 계속
      # 붙어 UNAVAILABLE → 서킷브레이커(aiServer) 열림 → 「AI 장애」로 오독됐을 자리다.
      # 기본값은 도커 네트워크 기준이라 로컬 bootRun 은 AI_SERVER_HOST=localhost 를 준다
      # (위 datasource url 의 ${DB_HOST:shadowfit-mysql} 과 같은 방식).
      address: 'static://${AI_SERVER_HOST:shadowfit-ai}:${AI_SERVER_GRPC_PORT:8585}'
      negotiation-type: plaintext

# [3] Swagger 및 기타 설정 (최상단 레벨)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  whitelist:
    - "/"
    - "/error"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/webjars/**"
    - "/member/login"
    - "/member/signup"
    # ⚠️ permitAll 이 이 엔드포인트의 **전제**다 (이슈 #135).
    #
    # 재발급은 access token 이 만료된 뒤에 불리는 것이 정상 경로라, 인증을 요구하면 «만료돼서
    # 부르는 API 가 만료 때문에 막히는» 상태가 된다. 그래서 필터를 안 태운다.
    #
    # 그 대신 신원 근거가 요청자(SecurityContext)가 아니라 **refresh token 의 서명**이다 —
    # 서버가 서명한 것이라 위조가 불가능하고, subject 가 곧 소유자다.
    # (decisions/token-lifecycle.md §4-2 — «요청자 기준으로 확인한다» 는 처음 안이 틀렸던 자리다)
    - "/member/reissue"
    - "/ws/**"
    - "/actuator/health"
    - "/actuator/health/**"
    # ⚠️ 2026-08-08 — 이 줄이 필요하다는 것은 **실측으로 알았다.**
    #
    # 관리 포트를 9090 으로 분리하면(management.server.port) 시큐리티가 거기엔 안
    # 걸릴 것으로 봤는데 **틀렸다.** 실제로는 필터체인이 두 포트에 공유돼서,
    # 분리만 해두면 Prometheus 가 9090 을 긁을 때 401 을 받는다(검증 로그: 9090
    # /actuator/prometheus → 401, /actuator/health → 200 ← 이 whitelist 때문).
    #
    # 그래서 permitAll 이 필요하다. 지표가 공개되지 않는 근거는 **인증이 아니라
    # 포트 경계**다 — 액추에이터는 9090 에서만 서비스되고, prod compose 는 그
    # 포트를 호스트에 매핑하지 않는다. 8080 에 같은 경로를 쳐도 핸들러가 없다.
    # 🔴 따라서 9090 을 어딘가에 노출하는 순간 이 whitelist 가 그대로 뚫린다.
    - "/actuator/prometheus"

# [6] Actuator — 캐시 히트율·서킷브레이커 상태 관측용
management:
  # ⚠️ 2026-08-08: 관리 엔드포인트를 앱 포트(8080)에서 분리했다.
  #
  # 이유는 /actuator/prometheus 다. Prometheus 가 긁어가려면 인증 없이 닿아야 하는데,
  # 8080 은 외부 노출이라 whitelist 에 넣으면 지표가 인터넷에 공개된다 — 엔드포인트별
  # 응답시간·에러율·회원 수 추이가 전부 보인다.
  #
  # 그래서 포트를 나누고 compose 에서 9090 을 **매핑하지 않는다.** 같은 도커 네트워크
  # 안의 Prometheus 만 shadowfit-backend:9090 으로 닿는다. AI 서버 gRPC 8585 를
  # expose 만 하고 ports 에 안 쓰는 것과 같은 방식이다.
  #
  # 🔴 부작용: /actuator/health 도 같이 9090 으로 옮겨간다. 컨테이너 healthcheck 와
  #    verify 스킬이 8080 을 치고 있어 함께 고쳤다(docker-compose.prod.yml,
  #    .claude/skills/verify/SKILL.md). 둘 다 안쪽에서 부르므로 매핑 없이 닿는다.
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        # flyway: 이 서버가 어느 버전까지 적용했는지 HTTP 로 확인한다 (GET /actuator/flyway).
        # 배포 후 "스키마가 코드보다 뒤처졌나"를 DB 에 붙지 않고 볼 수 있어 CD 와 맞물린다.
        # prometheus: 스크레이프 대상. 위 포트 분리로 외부에서는 닿지 않는다.
        include: health,caches,metrics,circuitbreakers,circuitbreakerevents,flyway,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# [7] Resilience4j — Spring→AI(FastAPI) gRPC 호출(StartAnalysis/ExtractReferenceData/StopAnalysis)
# 서킷브레이커. AI 장애 시 백엔드가 계속 호출을 밀어넣는 대신 빠르게 실패해서 graceful하게
# 버티도록(load-test-strategy.md §9.2 OPEN 항목, production-signal-checklist.md §2-3 재확인).
resilience4j:
  circuitbreaker:
    instances:
      aiServer:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

jwt:
  secret: ${JWT_SECRET}
  # 30분. 24시간에서 줄였다 (이슈 #137, decisions/token-lifecycle.md §3-0-2).
  #
  # ⚠️ **측정값이 아니라 약속(threshold)이다.** 이 프로젝트엔 세션 길이 분포도 SLO 도 사용
  # 로그도 없어 유도할 근거가 없다. 이 값의 의미는 하나뿐이다 — 블랙리스트를 없앤 대가로
  # **로그아웃 후 access 가 살아 있는 최대 구간**이 곧 이 값이다.
  #
  # 줄일 수 있게 된 전제: 프론트에 재발급 호출이 붙었다(api.ts reissueOnce, #135). 그게 없던
  # 동안은 수명을 줄이면 그 주기로 사용자가 로그아웃돼서 24시간을 쓸 수밖에 없었다.
  expiration_time: ${JWT_EXPIRATION_TIME:1800}
  refresh_expiration_time: ${JWT_REFRESH_EXPIRATION_TIME:604800}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

ai-server:
  url: ${AI_SERVER_URL:http://shadowfit-ai:8000}

# [5] 운동 세션 타임아웃 설정
exercise:
  session:
    timeout:
      # [주 기준] 마지막 활동(rep 완성) 이후 이만큼 지나면 걷어간다.
      # session-liveness-vs-elapsed-time.md ㄷ안 — 생존 판정을 경과 시간에서 마지막 활동으로 옮겼다.
      # 하한 근거: 세트 사이 휴식이 90초까지 관측됐다(이슈 #91 재현). 그동안은 rep 이 안 나와
      # 갱신이 멈추므로 그보다 넉넉해야 한다. 10분이면 여유가 크고, 이탈한 세션도 종전 45분이
      # 아니라 10분 만에 정리된다.
      idle-minutes: 10
      # [폴백 전용] 아직 rep 이 하나도 없는 세션(자세 잡기·준비 중)에만 쓰는 기존 식의 버퍼.
      # 예: 스쿼트 예상시간 15분 + 30분 버퍼 = 45분. 첫 rep 이 들어오는 순간 위 idle 기준으로
      # 넘어간다. 준비 구간에 짧은 유휴 임계를 걸면 시작하자마자 걷어가게 되어 남겨둔다.
      default-buffer-minutes: 30
      # 스케줄러 체크 간격(분) - 매 1분마다 체크
      check-interval-minutes: 1

# [5.5] 회원 탈퇴 가드 (withdrawal-with-active-session.md, 이슈 #87)
member:
  withdrawal:
    # 이 시간 동안 pose_data 유입이 없으면 그 IN_PROGRESS 세션은 죽은 것(앱 종료·네트워크 단절)으로
    # 보고 탈퇴를 허용한다. 상태값만 보면 좀비 세션 때문에 운동 중이 아닌 사용자가 최대 ~45분간
    # 탈퇴하지 못한다.
    #
    # 값의 근거는 배치 간격(rep 단위 ~3~4초)이 아니라 **세트 간 휴식**이다. 휴식 중에는 rep 이
    # 완성되지 않아 AI 가 콜백을 안 보내므로 Spring 이 보기엔 죽은 세션과 구분되지 않는다 —
    # 이 프로젝트는 이미 같은 이유로 ET-C(AI timeout 자동 종료)를 거부한 적이 있다(tts-design.md
    # §2.A ET-C: "세트 사이 휴식 시간(30~90초)도 frame 안 오는 구간이라 휴식과 종료 구분 불가").
    #
    # restTimeSec = max(90 - (level-1)*5, 30) → 최대 90초(초급자, 12-persona-difficulty.md:90).
    # 여기에 2배 여유를 둬 180초. 짧게 잡으면 쉬는 중인 사용자를 죽은 것으로 오판해 "정말 운동
    # 중인데 탈퇴가 통과"하는데, 그건 막으려던 결함 그 자체라 반대 방향 오판(죽은 세션 때문에
    # 3분 더 기다림)보다 훨씬 나쁘다.
    active-workout-idle-seconds: 180

# [6] pose_data 파티션 TTL 설정 (report-read-path.md §9-B, 2026-07-24 확정)
pose-data:
  partition:
    # 이번 달 + 이 개월 수만큼은 보존(버퍼), 그보다 오래된 파티션은 드롭
    retention-buffer-months: 1
    # pfuture가 실데이터를 안 떠안도록 이번 달 기준 몇 개월 앞까지 미리 파티션을 만들어둘지
    lookahead-months: 2
    # 파티션 점검 주기 - 월 단위 하우스키핑이라 매일 1회(새벽 4시)면 충분
    check-cron: "0 0 4 * * *"
  # 고아 행 관측 (이슈 #87) — 세기만 하고 지우지 않는다. 수정안 선택에 필요한 발생 빈도를 모으는 용도
  orphan-monitor:
    # anti-join 범위. 파티션 TTL(이번 달 + 지난 1개월)이 살려두는 범위와 맞춘다 — 그보다 오래된
    # 행은 곧 통째로 드롭되므로 세지 않는다. created_at 하한이 파티션 pruning 도 걸어준다
    lookback-months: 2
    # 파티션 드롭(4시)이 끝난 뒤에 세야 곧 사라질 행까지 세어 값이 부풀지 않는다
    check-cron: "0 30 4 * * *"

# [4] 로깅 설정 (최상단 레벨)
logging:
  level:
    root: INFO
    com.shadowfit: DEBUG
    io.github.lognet.grpc: DEBUG
    net.devh: DEBUG
    org.springframework.jdbc.datasource.init: DEBUG # SQL 초기화 로그 확인용
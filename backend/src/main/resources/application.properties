spring.application.name=shadowfit

# [SWAGGER]
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# [HikariCP]
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000
# maximum-pool-size는 application.yml에서만 관리(15, 분리 배포 실측 근거는
# docs/decisions/pose-ingest-downsampling.md §5-1(7)(8)) — 여기 있으면 properties가
# yml을 덮어써서 yml 값이 무시됨(2026-07-25 발견, CodeRabbit 리뷰: PR #53). 위
# datasource/whitelist와 동일한 이유로 여기 다시 넣지 말 것.

# [SQL Init & JPA]
# ?? SQL ??? ?? JPA ?? ?? ??? ????? ?????.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
# ddl-auto는 application.yml(none, 도커 schema.sql이 유일 소스)에서만 관리 — properties가
# yml을 덮어써서 여기 있으면 실제로는 update가 이겨 Hibernate가 스키마를 조용히 자동 변경함
# (2026-07-15 발견: refresh_token 테이블이 schema.sql엔 없는데 존재했던 원인이 이거였음).
# 위 datasource/whitelist와 동일한 이유로 여기 다시 넣지 말 것.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# [Logging]
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# [DB Connection / JWT]
# datasource, jwt 등 환경별 설정은 application.yml(dev/prod 프로파일)에서 관리
# 여기에 절대 다시 넣지 말 것 - properties가 yml을 덮어써서 dev 설정이 무시됨

# security.whitelist는 application.yml에서만 관리 (indexed properties가 yml list를
# 통째로 덮어써서 여기 있으면 yml 수정이 반영 안 됨 — 위와 동일한 이유로 여기 넣지 말 것.
# /internal/** 항목은 이미 gRPC(ExerciseGrpcService)로 통합된 죽은 REST 경로라 삭제.)
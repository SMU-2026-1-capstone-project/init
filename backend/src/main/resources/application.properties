spring.application.name=shadowfit

# [SWAGGER]
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# [HikariCP]
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000
# maximum-pool-size는 application.yml에서만 관리(15, 분리 배포 실측 근거는
# docs/decisions/pose-ingest-downsampling.md §5-1(7)(8)) — 여기 있으면 properties가
# yml을 덮어써서 yml 값이 무시됨(2026-07-25 발견, CodeRabbit 리뷰: PR #53). 위
# datasource/whitelist와 동일한 이유로 여기 다시 넣지 말 것.

# [SQL Init & JPA]
# 스키마는 Flyway 가 소유한다 — Spring 의 SQL 초기화(schema.sql/data.sql 자동 실행)는 끈다.
# defer-datasource-initialization=false 는 그 초기화를 JPA 뒤로 미루지 않는다는 뜻인데,
# init 자체를 never 로 껐으므로 함께 꺼둔 상태를 명시하는 것이다.
# (원래 이 자리에 한글 주석이 있었으나 레포 이관(eccab13, 2026-04-02) 시점에 이미 깨진 채로
#  들어와 복구 불가라, 2026-08-12 에 설정이 실제로 하는 일로 다시 썼다.)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
# ddl-auto는 application.yml에서만 관리(none — Flyway 가 스키마를 소유하므로 Hibernate 는
# 만들지도 검증하지도 않는다) — properties가 yml을 덮어써서 여기 있으면 실제로는 update가
# 이겨 Hibernate가 스키마를 조용히 자동 변경함.
# (2026-07-15 발견: refresh_token 테이블이 당시 스키마 원본이던 mysql/schema.sql엔 없는데
#  존재했던 원인이 이거였음. 그 파일은 이후 #115 Flyway 도입으로 삭제됐고, 지금 원본은
#  backend/src/main/resources/db/migration/ 이다.)
# 위 datasource/whitelist와 동일한 이유로 여기 다시 넣지 말 것.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# [Logging]
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# [DB Connection / JWT]
# datasource, jwt 등 환경별 설정은 application.yml에서만 관리.
# ⚠️ 프로파일별 블록으로 갈라져 있지 않다 — yml 은 한 벌이고 환경차는 환경변수가 낸다
#    (예: url 의 ${DB_HOST:shadowfit-mysql}. 로컬 bootRun 은 .env 의 DB_HOST=localhost).
# 여기에 절대 다시 넣지 말 것 - properties가 yml을 덮어써서 yml 설정이 무시됨

# security.whitelist는 application.yml에서만 관리 (indexed properties가 yml list를
# 통째로 덮어써서 여기 있으면 yml 수정이 반영 안 됨 — 위와 동일한 이유로 여기 넣지 말 것.
# /internal/** 항목은 이미 gRPC(ExerciseGrpcService)로 통합된 죽은 REST 경로라 삭제.)
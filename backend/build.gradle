plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'com.shadowfit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Spring Boot 핵심 ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// --- DB & Utility ---
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'io.github.cdimascio:dotenv-java:3.2.0'
	implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.6'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// springdoc(swagger-core-jakarta)이 끌어오는 commons-lang3 3.17.0이 GHSA-j288-q9x7-2f5v
	// (3.0~3.17.x 취약, 긴 입력 처리 시 무한 재귀)에 걸려 있어 명시적으로 상향.
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'

	// --- Security ---
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Boot 3.5.16이 관리하는 jackson-databind(2.21.4)가 GHSA-5jmj-h7xm-6q6v(2.19.0~2.21.4
	// 취약)에 걸려 있어 이 모듈만 명시적으로 상향(jackson-bom의 나머지 모듈은 그대로 둠).
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'

	// --- QueryDSL (동적 조회 계층, querydsl-adoption.md §1-1 채택) ---
	// 버전을 박지 않는 이유: Boot 3.5.16 의 의존성 관리가 QueryDSL 5.1.0 을 이미 잡고 있다.
	// 'jakarta' 분류자는 필수 — 빠뜨리면 javax 기반 아티팩트가 딸려온다.
	implementation 'com.querydsl:querydsl-jpa::jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// --- Lombok & Dev ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- gRPC & Protobuf (버전 정합성 해결) ---
	def grpcVersion = '1.82.2'
	def protobufVersion = '3.25.5'

	// Starter는 API만 제공하고 실제 구현체는 아래에서 버전 고정
	implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
	implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

	// 핵심 클래스들 (GeneratedMessageV3 등을 포함함)
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-services:${grpcVersion}"

	// 유틸리티 (Timestamps 사용을 위해 필수!)
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

	compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'

	//docker 빌드 없이 바로 수정
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:3.25.5"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:1.82.2"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			// 이 중괄호 안에 아무것도 없어도 이 블록 자체가 'grpc' 파일을 만들라고 명령하는 겁니다.
			grpc {}
		}
	}
}

sourceSets {
	main {
		java {
			// 하드코딩된 문자열 대신, generateProto 태스크가 만든 결과물 경로를 직접 참조합니다.
			srcDirs 'src/main/java'
			srcDirs 'build/generated/source/proto/main/java'
			srcDirs 'build/generated/source/proto/main/grpc'
		}
	}
}
	tasks.named('test') {
		useJUnitPlatform()

		// 아래 둘은 같은 문제의 서로 다른 사례다 — gradlew 에 준 -D 는 Gradle 자신의 JVM 에만
		// 붙고 포크된 테스트 JVM 으로 자동 전달되지 않아, 그대로 두면 @EnabledIfSystemProperty 가
		// 테스트 쪽에서 못 보고 **조용히 스킵**된다. 둘 다 기본값이 없으므로 평소에는 프로퍼티
		// 자체가 없고 해당 테스트만 건너뛴다.

		// 레이스 재현 테스트(PoseDataOrphanRaceTest)는 실제 MySQL(3307)이 필요하다.
		if (System.getProperty('race.mysql') != null) {
			systemProperty 'race.mysql', System.getProperty('race.mysql')
		}

		// AdminMemberExplainCaptureTest — loadtest/measure_admin_filter_explain.sh 전용.
		if (System.getProperty('explain.capture') != null) {
			systemProperty 'explain.capture', System.getProperty('explain.capture')
		}
	}
